services:
  postgres:
    # Auth database (BetterAuth users/sessions/OTPs). Same engine as production.
    image: postgres:18-alpine
    container_name: queenix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: queenix
      POSTGRES_PASSWORD: queenix-local-only
      POSTGRES_DB: queenix_auth
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      # TCP check: the image's first-boot init server is socket-only, so this
      # only passes once the real server is up (not mid-initialization).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U queenix -d queenix_auth"]
      interval: 3s
      timeout: 3s
      retries: 30

  mailpit:
    # Local inbox: catches every email AND (SMS_PROVIDER=dev-inbox) every SMS.
    # UI http://localhost:8025 — tests read codes from its API.
    image: axllent/mailpit:latest
    container_name: queenix-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  ocr:
    # OCR service (services/ocr): IDs, passports, plates, receipts, forms.
    build:
      context: services/ocr
    container_name: queenix-ocr
    restart: unless-stopped
    environment:
      OCR_API_KEY: dev-ocr-key
    ports:
      - "8800:8000"

  convex-backend:
    # Self-hosted Convex stores all state in SQLite via the /convex/data volume.
    # No separate database required for local dev. For prod-with-postgres,
    # set POSTGRES_URL and remove DO_NOT_REQUIRE_SSL.
    image: ghcr.io/get-convex/convex-backend:latest
    container_name: queenix-convex
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "3210:3210"
      - "3211:3211"
    volumes:
      - convex_data:/convex/data
    environment:
      CONVEX_CLOUD_ORIGIN: http://localhost:3210
      CONVEX_SITE_ORIGIN: http://localhost:3211
      DO_NOT_REQUIRE_SSL: "true"
      DISABLE_BEACON: "true"
      DISABLE_METRICS_ENDPOINT: "true"
      INSTANCE_NAME: local-dev
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 30

  convex-dashboard:
    # Pinned by commit SHA: :latest (2026-09, Next 16/turbopack build) 500s on
    # every route — its SSR bundle references an externalized
    # @radix-ui/react-icons chunk missing from the image. Last good build
    # before that regression is 2025-10-22 below (verified 200 on /).
    image: ghcr.io/get-convex/convex-dashboard:6d7b35510d3501705b637964aab201d076893e72
    container_name: queenix-convex-dashboard
    restart: unless-stopped
    ports:
      - "6791:6791"
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: http://localhost:3210
    depends_on:
      convex-backend:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: queenix-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
    environment:
      NODE_ENV: development
      # Next dev restarts itself near the heap limit (default ~2GB) once the
      # console's ~22 Tamagui routes are compiled; 4GB keeps a full walk stable.
      NODE_OPTIONS: --max-old-space-size=4096
      CONVEX_SELF_HOSTED_URL: http://convex-backend:3210
      CONVEX_SITE_URL: http://localhost:3211
      NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL:-http://localhost:3210}
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      # Shared testing DB (same file the host uses) so seed/migrate/host-dev
      # and the container all see the same users.
      DATABASE_URL: postgres://queenix:queenix-local-only@postgres:5432/queenix_auth
      CONVEX_DEPLOY_KEY: ${CONVEX_DEPLOY_KEY:-}
      SMTP_URL: smtp://mailpit:1025
      EMAIL_FROM: Queenix Gym <no-reply@queenix.local>
      SMS_PROVIDER: dev-inbox
      OCR_URL: http://ocr:8000
      OCR_API_KEY: dev-ocr-key
      AUTH_SECRET: ${AUTH_SECRET:-testing-secret-replace-before-production-min-32-chars-0123456789ab}
      QUEENIX_ADMIN_TOKEN: ${QUEENIX_ADMIN_TOKEN:-queenix-dev-admin-token}
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-mock}
    depends_on:
      postgres:
        condition: service_healthy
      convex-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/scanner/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 20

  convex-sync:
    # Pushes Convex functions to the local backend and keeps them synced.
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: queenix-convex-sync
    restart: unless-stopped
    working_dir: /app
    command: ["npm", "run", "dev", "--workspace", "@queenix/convex"]
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      CONVEX_SELF_HOSTED_URL: http://convex-backend:3210
    depends_on:
      convex-backend:
        condition: service_healthy

  expo:
    # Mobile dev server (Metro). QR + URLs print in `docker logs queenix-expo`.
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile.dev
    container_name: queenix-expo
    restart: unless-stopped
    ports:
      - "${EXPO_PORT:-8081}:8081"
      - "19002:19002"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/mobile/node_modules
    environment:
      EXPO_PUBLIC_CONVEX_URL: ${EXPO_PUBLIC_CONVEX_URL:-http://localhost:3210}
      EXPO_PUBLIC_AUTH_BASE_URL: ${EXPO_PUBLIC_AUTH_BASE_URL:-http://localhost:3000}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${EXPO_HOST_IP:-localhost}
    depends_on:
      convex-backend:
        condition: service_healthy

  seed:
    # One-shot: signs up the 6 demo accounts, links them into Convex, and
    # loads the realistic demo dataset. Runs after web is healthy; retries
    # Convex until functions are synced.
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: queenix-seed
    restart: "no"
    working_dir: /app
    command: ["node", "scripts/seed-demo-users.mjs"]
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      AUTH_BASE_URL: http://web:3000
      EXPO_PUBLIC_CONVEX_URL: http://convex-backend:3210
      QUEENIX_ADMIN_TOKEN: ${QUEENIX_ADMIN_TOKEN:-queenix-dev-admin-token}
      CONVEX_DEPLOY_KEY: ${CONVEX_DEPLOY_KEY:-}
    depends_on:
      web:
        condition: service_healthy
      convex-backend:
        condition: service_healthy
      convex-sync:
        condition: service_started

volumes:
  convex_data:
  pg_data:
