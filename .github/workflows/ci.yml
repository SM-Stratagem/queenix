name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test
        env:
          TAP_SECRET_KEY: ci-stub
          AUTH_SECRET: ci-testing-secret-replace-before-production-min-32-chars-01234
