name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
        env:
          TAP_SECRET_KEY: ci-stub
          AUTH_SECRET: ci-testing-secret-replace-before-production-min-32-chars-01234

  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      convex:
        image: ghcr.io/get-convex/convex-backend:latest
        ports: ['3210:3210', '3211:3211']
        env:
          DO_NOT_REQUIRE_SSL: 'true'
          INSTANCE_NAME: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: cd packages/convex && npm install convex@latest
      - name: Push Convex code
        run: |
          cd packages/convex
          docker exec $(docker ps -qf "name=convex-backend" | head -1) /convex/generate_admin_key.sh > /tmp/admin-key.txt
          KEY=$(cat /tmp/admin-key.txt | head -1)
          echo "CONVEX_SELF_HOSTED_ADMIN_KEY=$KEY" > .env.local
          echo "CONVEX_SELF_HOSTED_URL=http://localhost:3210" >> .env.local
      - run: cd packages/convex && npx convex dev --once || true
      - name: Migrate BetterAuth SQLite
        run: npm run db:migrate
      - name: Start Next.js web
        run: |
          cd apps/web
          AUTH_BASE_URL=http://localhost:3000 \
          AUTH_SECRET=ci-testing-secret-replace-before-production-min-32-chars-01234 \
          AUTH_TRUST_HOST=true \
          QUEENIX_ADMIN_TOKEN=ci-admin \
          WEB_PORT=3000 \
          npm run dev &
          sleep 15
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        run: cd apps/web && WEB_PORT=3000 npx playwright test

